spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/webstore
    username: postgres
    password:
  jpa:
    hibernate:
      #ddl-auto: create-drop
      #ddl-auto: create
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

