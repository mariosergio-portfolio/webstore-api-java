spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=webstore #flyway is not able to create the database itself
    username: postgres
    password: 123
  jpa:
    hibernate:
      #ddl-auto: create-drop
      #ddl-auto: create
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

