server:
  port: 8080
  servlet:
    context-path: /webstore # must be same of cloudFormation variable $AppServiceName (used by ALB rule)

spring:
  application:
    name: webstore-java
  profiles:
    #active: postgres
    #active: h2
    active: postgres
    #active: prod
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: webstore
    # This tells Flyway: on a non-empty schema with no history table, just record a baseline at version 0 instead of erroring out,
    # then apply every migration with a version above that — which is both V1
    # only required if you have an existing schema with no flyway history table,
    #  eg: if you are migrating an existing database to use flyway for the first time.
    #      or if you do not specifically want to start with a baseline version of 1, but rather 0.
    #baseline-on-migrate: true
    #baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, mappings
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Web Store REST API — Catalog module
    version: "@project.version@"
  instance:
    hostname: ${HOSTNAME:localhost}
    ip: ${ECS_CONTAINER_METADATA_URI_V4:unknown}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.mycompany.webstore.infrastructure.rest

app:
  public:
    url: "${APP_PUBLIC_URL:http://localhost:8080/}"

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.flywaydb: DEBUG
