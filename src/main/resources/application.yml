spring:
  application:
    name: webstore-java
  profiles:
    #active: devPostgres
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, mappings
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Web Store REST API — Catalog module
    version: "@project.version@"
  instance:
    hostname: ${HOSTNAME:localhost}
    ip: ${ECS_CONTAINER_METADATA_URI_V4:unknown}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.mycompany.webstore.infrastructure.rest

app:
  public:
    url: "${APP_PUBLIC_URL:http://localhost:8080/}"

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.flywaydb: DEBUG
